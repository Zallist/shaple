name: Build and Deploy to GitHub Pages
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GA_ID: ${{ vars.GA_ID }} # set in GitHub → Settings → Actions → Variables
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        
      - name: Inject Google Analytics
        if: env.GA_ID != ''
        run: |
          GA_TAG=$(cat <<EOF
          <!-- Google tag (gtag.js) -->
          <script async src='https://www.googletagmanager.com/gtag/js?id=${GA_ID}'></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', '${GA_ID}');
          </script>
          EOF
          )
          
          for file in $(find dist -type f -name '*.html'); do
            awk -v tag="$GA_TAG" '/<\/head>/{print tag}1' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
          done

      - name: Upload production build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
